# Example Configuration for Rebuilt Hybrid Memory System (v2.0 CLI Engine)
# Copy or edit these values for your local environment, or override at runtime
# via CLI flags (--vault, --profile) or environment variables
# (HERMES_MEMORY_VAULT, HERMES_MEMORY_PROFILE).
schema_version: 2

# Example local Vault path (replace with your Obsidian Vault path, e.g. ~/Documents/MyVault)
vault_path: ./demo_vault

# Example active profile (e.g., default, personal, work)
profile: default

# Shared/Global profiles accessible across all agents
shared_profiles:
  - shared
  - global

# Model configurations
# NOTE: extractor_model is used only when the API key env var is set (otherwise local fallback runs).
#       reflection_model is a configuration placeholder; automated reflection cron is not implemented yet.
models:
  extractor_model: gpt-4o-mini
  reflection_model: luna
  api_key_env: OPENAI_API_KEY
  api_base: null

# Retrieval and Context Budget
retrieval:
  max_results: 6
  max_tokens: 1200
  chunk_tokens: 400
  min_confidence: 0.5
  include_shared: true
